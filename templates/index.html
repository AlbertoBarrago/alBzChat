<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
</head>
<body class="bg-gray-100 p-5">
<div class="container mx-auto max-w-lg bg-white rounded-lg shadow-lg p-6">
    <h1 class="text-2xl font-bold text-center mb-6">Chat Application</h1>

    <!-- LOGIN || SUBSCRIPTION -->
    <div id="auth-section" class="mb-4">
        <h2 class="text-xl font-semibold mb-4">Register / Login</h2>
        <div class="flex mb-4">
            <button class="tab active flex-1 py-2 bg-green-500 text-white rounded-l-lg transition duration-300 ease-in-out hover:bg-green-400 focus:outline-none"
                    onclick="showForm('register')">
                Register
            </button>
            <button class="tab flex-1 py-2 bg-gray-300 text-gray-700 rounded-r-lg transition duration-300 ease-in-out hover:bg-gray-400 focus:outline-none"
                    onclick="showForm('login')">
                Login
            </button>
        </div>
        <form id="register-form" hx-post="/auth/register" hx-target="#auth-response" hx-swap="innerHTML"
              class="form-container">
            <label>
                <input type="text" name="username" placeholder="Enter your username" required
                       class="border border-gray-300 rounded-lg p-3 w-full mb-2 focus:outline-none focus:ring-2 focus:ring-green-500">
            </label>
            <label>
                <input type="password" name="password" placeholder="Enter your password" required
                       class="border border-gray-300 rounded-lg p-3 w-full mb-2 focus:outline-none focus:ring-2 focus:ring-green-500">
            </label>
            <button type="submit"
                    class="bg-green-500 text-white rounded-lg px-4 py-2 transition duration-300 ease-in-out hover:bg-green-400 focus:outline-none">
                Register
            </button>
        </form>
        <form id="login-form" hx-post="/auth/login" hx-target="#auth-response" hx-swap="innerHTML"
              class="form-container hidden">
            <label>
                <input type="text" name="username" placeholder="Enter your username" required
                       class="border border-gray-300 rounded-lg p-3 w-full mb-2 focus:outline-none focus:ring-2 focus:ring-green-500">
            </label>
            <label>
                <input type="password" name="password" placeholder="Enter your password" required
                       class="border border-gray-300 rounded-lg p-3 w-full mb-2 focus:outline-none focus:ring-2 focus:ring-green-500">
            </label>
            <button type="submit"
                    class="bg-blue-500 text-white rounded-lg px-4 py-2 transition duration-300 ease-in-out hover:bg-blue-400 focus:outline-none">
                Login
            </button>
        </form>
        <div id="auth-response" class="text-red-500 mt-4"></div>
    </div>

    <!-- CHAT WRAPPER-->
    <div id="chat-section" class="hidden flex-grow overflow-hidden">
        <!-- ACTION LIST-->
        <button id="logout"
                class="bg-red-300 text-white rounded-lg px-4 py-2 mb-4 transition duration-300 ease-in-out hover:bg-blue-400 focus:outline-none">
            Logout
        </button>
        <button id="history" hx-get="/message/history" hx-target="#chat-history" hx-swap="innerHTML"
                class="bg-blue-500 text-white rounded-lg px-4 py-2 mb-4 transition duration-300 ease-in-out hover:bg-blue-400 focus:outline-none">
            Load History
        </button>
        <!-- CHAT INPUT-->
        <form id="message-form" hx-post="/message/send" hx-target="#response" hx-swap="beforeend" class="flex mb-4">
            <label class="w-full">
                <input type="text" name="message" placeholder="Type your message" required
                       class="border border-gray-300 rounded-lg p-3 w-full">
            </label>
            <button type="submit"
                    class="ml-3 bg-green-500 text-white rounded-lg px-4 py-3 transition duration-300 ease-in-out hover:bg-green-400 focus:outline-none">
                Send
            </button>
        </form>
        <!-- CHAT PANEL-->
        <div id="response"
             class="mb-4 border border-gray-300 rounded-lg w-full max-h-80 flex-grow overflow-y-auto p-3">
        </div>
        <!-- HISTORY -->
        <div id="chat-history"
             class="bg-gray-50 border border-gray-300 rounded-lg p-4 max-h-80 overflow-y-auto fade-in hidden">
        </div>
    </div>
</div>

<script>
    // SETUP INIT
    (function init() {
        // WebSocket variable
        let websocket = null;

        // Function to load all messages on enter
        function loadAllMessages() {
            fetch('/message/all-messages', {
                headers: {
                    'Authorization': `Bearer ${sessionStorage.getItem("token")}`
                }
            })
            .then(response => response.text())
            .then(html => {
                document.getElementById('response').innerHTML = html;
                showDeleteButtons();
                scrollToBottom();
            })
            .catch(error => console.error('Error loading messages:', error));
        }

        // Function to show delete buttons only for user's messages
        function showDeleteButtons() {
            const token = sessionStorage.getItem("token");
            if (token) {
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const currentUserId = payload.user_id;

                    document.querySelectorAll('.delete-btn').forEach(btn => {
                        const messageUserId = parseInt(btn.dataset.userId);
                        if (messageUserId === currentUserId) {
                            btn.style.display = 'block';
                        }
                    });
                } catch (e) {
                    console.error('Error parsing token:', e);
                }
            }
        }

        // Function to scroll to bottom
        function scrollToBottom() {
            const messageContainer = document.getElementById("response");
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        // Function to delete message
        function deleteMessage(messageId) {
            fetch(`/message/delete/${messageId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${sessionStorage.getItem("token")}`
                }
            })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        // Remove message from UI
                        const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
                        if (messageElement) {
                            messageElement.remove();
                        }

                        // Broadcast deletion to other clients
                        if (websocket && websocket.readyState === WebSocket.OPEN) {
                            const deleteData = {
                                type: 'delete',
                                messageId: messageId
                            };
                            websocket.send(JSON.stringify(deleteData));
                        }
                    } else {
                        alert('Error deleting message: ' + result.message);
                    }
                })
                .catch(error => {
                    console.error('Error deleting message:', error);
                    alert('Error deleting message');
                });
        }

        function initWebSocket() {
            const HOST = "ws://localhost:65432";
            websocket = new WebSocket(HOST);

            websocket.addEventListener("open", () => {
                console.log("Connected to the WebSocket server.");
            });

            websocket.addEventListener("message", (event) => {
                console.log("Message received: ", event.data);

                try {
                    // Try to parse as JSON
                    const messageData = JSON.parse(event.data);
                    displayMessage(messageData.user, messageData.content);
                } catch (e) {
                    // Handle plain text messages
                    displayMessage("Server", event.data);
                }
            });

            websocket.addEventListener("close", () => {
                console.log("Disconnected from WebSocket server.");
                setTimeout(initWebSocket, 3000);
            });

            websocket.addEventListener("error", (error) => {
                console.error("WebSocket error: ", error);
            });
        }

        function displayMessage(username, content) {
            const messageContainer = document.getElementById("response");
            const newMessage = document.createElement("div");
            newMessage.innerHTML = `<strong>${username}:</strong> ${content}`;
            newMessage.classList.add("p-2", "mb-2", "bg-blue-100", "rounded-lg");
            messageContainer.appendChild(newMessage);

            // Auto-scroll to bottom of chat
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        // Verify on load if the user is logged in
        document.addEventListener("DOMContentLoaded", () => {
            const token = sessionStorage.getItem("token");

            if (token) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('chat-section').classList.remove('hidden');
                // Initialize WebSocket and load messages if user is already logged in
                initWebSocket();
                loadAllMessages();
            }

            // Handle delete button clicks
            document.addEventListener('click', function (e) {
                if (e.target.classList.contains('delete-btn')) {
                    const messageId = e.target.dataset.messageId;
                    deleteMessage(messageId);
                }
            });

            document.addEventListener('htmx:afterRequest', (event) => {
                const response = document.getElementById('response');
                const lastMessage = response.lastElementChild;
                if (lastMessage) {
                    console.log(lastMessage);
                    window.lastTimestamp = lastMessage.getAttribute('data-timestamp');
                }

                // Show delete buttons after HTMX requests
                showDeleteButtons();
            });

            // Handling load history
            document.getElementById('history').addEventListener('click', () => {
                let el = document.getElementById('chat-history');
                el.classList.remove('hidden');
            })

            // Clear message form
            document.getElementById("message-form").addEventListener("submit", function (event) {
                const input = this.querySelector("input[name='message']");
                const message = input.value.trim();

                if (websocket && websocket.readyState === WebSocket.OPEN && message) {
                    // Get username from token
                    const token = sessionStorage.getItem("token");
                    if (token) {
                        try {
                            // Decode JWT to get username
                            const payload = JSON.parse(atob(token.split('.')[1]));
                            const username = payload.username;

                            const messageData = {
                                user: username,
                                content: message
                            };

                            websocket.send(JSON.stringify(messageData));

                            // Clear input immediately
                            input.value = "";

                            // Prevent the default HTMX form submission
                            event.preventDefault();
                            return false;
                        } catch (e) {
                            console.error("Error parsing token:", e);
                        }
                    }
                }

                // If WebSocket fails, allow normal form submission
                setTimeout(() => {
                    this.reset();
                }, 500);
            });

            // Clear the register and login forms after submission
            document.getElementById("register-form").addEventListener("submit", function () {
                setTimeout(() => {
                    this.reset();
                }, 500);
            });

            document.getElementById("login-form").addEventListener("submit", function () {
                setTimeout(() => {
                    this.reset();
                }, 500);
            });

            // Logout
            document.getElementById('logout').addEventListener('click', () => {
                // Close WebSocket connection
                if (websocket) {
                    websocket.close();
                    websocket = null;
                }
                sessionStorage.removeItem('token')
                window.location.href = '/'
            });
        });

        // Set Auth Header for OAuth2
        document.body.addEventListener('htmx:configRequest', (event) => {
            const url = event.detail.path;
            const token = sessionStorage.getItem("token");

            if (token && !url.includes("/login") && !url.includes("/register")) {
                event.detail.headers['Authorization'] = `Bearer ${token}`;
            }
        });

        // After request if it is the login-form, set token in session storage
        document.addEventListener('htmx:afterRequest', (event) => {
            if (event.target.id === 'login-form') {
                const responseText = document.getElementById('auth-response').innerText.trim();
                const resp = JSON.parse(responseText);
                const token = resp.access_token;
                if (resp && resp.access_token) {
                    sessionStorage.setItem('token', token);
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('chat-section').classList.remove('hidden');

                    // Initialize WebSocket and load messages after successful login
                    initWebSocket();
                    loadAllMessages();
                }
            }
        });
    })();

    // SHOW FORM - F() FOR HANDLE TAB
    function showForm(formType) {
        const registerForm = document.getElementById('register-form');
        const loginForm = document.getElementById('login-form');
        const tabs = document.querySelectorAll('.tab');

        if (formType === 'register') {
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            tabs[0].classList.add('bg-green-500', 'text-white');
            tabs[0].classList.remove('bg-gray-300', 'text-gray-700');
            tabs[1].classList.add('bg-gray-300', 'text-gray-700');
            tabs[1].classList.remove('bg-green-500', 'text-white');
        } else {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            tabs[1].classList.add('bg-blue-500', 'text-white');
            tabs[1].classList.remove('bg-gray-300', 'text-gray-700');
            tabs[0].classList.add('bg-gray-300', 'text-gray-700');
            tabs[0].classList.remove('bg-blue-500', 'text-white');
        }
    }
</script>
</body>
</html>
